<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <title>QRコード一覧 - 純喫茶モバイルオーダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js (davidshimjs) - 最も安定したQRコード生成ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'retro-cream': '#FDF5E6',
                        'retro-brown': '#4B3621',
                        'retro-red': '#A40000',
                        'retro-dark': '#2A1F1B',
                    },
                    fontFamily: {
                        'serif': ['"Noto Serif JP"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .qr-card { break-inside: avoid; page-break-inside: avoid; }
            body { background: white !important; }
            #qr-grid { grid-template-columns: repeat(2, 1fr) !important; }
        }
        /* qrcodejs generates both canvas + img; hide canvas, show only img */
        .qr-card canvas {
            display: none !important;
        }
        .qr-card img {
            display: block !important;
            margin: 0 auto !important;
            width: 160px !important;
            height: 160px !important;
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-retro-cream text-retro-brown font-serif min-h-screen">

    <!-- Header -->
    <header class="bg-retro-dark text-retro-cream p-6 text-center no-print">
        <h1 class="text-3xl font-bold tracking-widest mb-2">純喫茶 QRコード</h1>
        <p class="text-sm opacity-70">各テーブルに設置するQRコードです（1〜8卓）</p>
    </header>

    <!-- Usage Instructions -->
    <div class="max-w-4xl mx-auto p-4 no-print">
        <details class="bg-amber-50 border-2 border-amber-300 rounded-lg mb-4" open>
            <summary class="p-3 font-bold cursor-pointer text-amber-800">📱 スマホで確認する方法</summary>
            <div class="px-4 pb-4 text-sm space-y-2 text-amber-900">
                <p><strong>① PCとスマホを同じWi-Fiに接続</strong></p>
                <p><strong>② 下のURL欄に表示されているIPアドレスを確認</strong><br>
                   <span class="text-xs opacity-70">（現在のサーバーアドレスが自動入力されています）</span></p>
                <p><strong>③ スマホのカメラでQRコードを読み取る！</strong></p>
                <p class="text-xs opacity-60 border-t border-amber-300 pt-2 mt-2">
                    💡 もしスマホから開けない場合は、URLの <code class="bg-white px-1 rounded">127.0.0.1</code> を
                    PCのローカルIP（例: <code class="bg-white px-1 rounded">192.168.x.x</code>）に変更してください。<br>
                    ターミナルで <code class="bg-white px-1 rounded">ipconfig getifaddr en0</code> を実行するとIPが分かります。
                </p>
            </div>
        </details>

        <!-- URL Config -->
        <div class="bg-white/80 border-2 border-retro-brown/20 rounded-lg p-4 mb-6">
            <label class="block text-sm font-bold mb-2">ベースURL（注文ページ）:</label>
            <div class="flex gap-2">
                <input type="text" id="base-url" 
                    class="flex-grow border-2 border-retro-brown/30 rounded px-3 py-2 font-mono text-sm bg-retro-cream focus:outline-none focus:border-retro-red"
                    placeholder="http://192.168.x.x:5500/index.html">
                <button onclick="generateAllQR()" 
                    class="bg-retro-red text-white px-6 py-2 rounded font-bold hover:bg-red-800 transition-colors whitespace-nowrap">
                    再生成
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mb-6 justify-center">
            <button onclick="window.print()" class="bg-retro-brown text-white px-6 py-2 rounded font-bold hover:bg-retro-dark transition-colors">
                🖨️ 印刷する
            </button>
        </div>
    </div>

    <!-- QR Code Grid -->
    <div id="qr-grid" class="max-w-4xl mx-auto px-4 pb-8 grid grid-cols-2 md:grid-cols-4 gap-6">
        <!-- QR cards will be injected here -->
    </div>

    <script>
        const TABLE_COUNT = 8;
        const baseUrlInput = document.getElementById('base-url');
        const qrGrid = document.getElementById('qr-grid');

        // Auto-detect base URL from current page
        function detectBaseUrl() {
            const loc = window.location;
            const base = `${loc.protocol}//${loc.hostname}${loc.port ? ':' + loc.port : ''}`;
            const pathParts = loc.pathname.split('/');
            pathParts.pop(); // Remove 'qr-codes.html'
            const dir = pathParts.join('/');
            return `${base}${dir}/index.html`;
        }

        baseUrlInput.value = detectBaseUrl();

        function generateAllQR() {
            const baseUrl = baseUrlInput.value.trim();
            if (!baseUrl) {
                alert('ベースURLを入力してください');
                return;
            }

            qrGrid.innerHTML = '';

            for (let table = 1; table <= TABLE_COUNT; table++) {
                const url = `${baseUrl}?table=${table}`;
                
                const card = document.createElement('div');
                card.className = 'qr-card bg-white border-4 border-double border-retro-brown rounded-lg p-4 text-center shadow-lg';
                
                const qrContainerId = `qr-container-${table}`;
                
                card.innerHTML = `
                    <div class="text-sm font-bold text-retro-brown/60 mb-1 tracking-widest">純喫茶</div>
                    <div class="text-3xl font-bold text-retro-red mb-3 tracking-wider">${table}卓</div>
                    <div id="${qrContainerId}" class="flex justify-center mb-3"></div>
                    <div class="border-t border-retro-brown/20 pt-2 mt-2">
                        <p class="text-[10px] text-retro-brown/50 font-mono break-all leading-relaxed">${url}</p>
                    </div>
                `;
                qrGrid.appendChild(card);

                // Generate QR code — using `new QRCode()` from qrcodejs
                try {
                    new QRCode(document.getElementById(qrContainerId), {
                        text: url,
                        width: 160,
                        height: 160,
                        colorDark: '#2A1F1B',
                        colorLight: '#FFFFFF',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    console.error(`Table ${table} QR error:`, e);
                    document.getElementById(qrContainerId).innerHTML = 
                        '<p class="text-red-500 text-xs">QR生成エラー</p>';
                }
            }
        }

        // Auto-generate on load
        window.addEventListener('DOMContentLoaded', () => {
            // Small delay to ensure library is fully loaded
            setTimeout(generateAllQR, 300);
        });
    </script>
</body>
</html>
