<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.googleapis.com https://*.firebaseio.com https://api.mymemory.translated.net https://*.cloudfunctions.net;">
    <title>昭和レトロ喫茶 注文票</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif JP for retro feel -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'retro-cream': '#FDF5E6',
                        'retro-brown': '#4B3621',
                        'retro-red': '#A40000',
                        'retro-dark': '#2A1F1B',
                    },
                    fontFamily: {
                        'serif': ['"Noto Serif JP"', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-retro-cream text-retro-brown font-serif overflow-x-hidden min-h-screen relative">
    <!-- Noise Texture Overlay -->
    <div class="fixed inset-0 pointer-events-none opacity-20 z-0 noise-bg"></div>
    
    <!-- CRT Overlay Effect -->
    <div id="crt-overlay" class="crt-overlay hidden"></div>

    <!-- Order Completed Modal -->
    <div id="order-complete-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#f4f1ea] p-8 max-w-sm w-full mx-4 border-4 border-double border-retro-brown shadow-[0_0_20px_rgba(255,255,255,0.2)] text-center transform scale-90 transition-transform duration-300">
            <h2 class="text-2xl font-bold text-retro-brown font-serif mb-4 tracking-widest">ご注文<br>承りました</h2>
            <p class="text-retro-brown mb-8 font-serif opacity-80">Order Completed</p>
            <button id="modal-ok-btn" class="bg-retro-red text-[#f4f1ea] px-8 py-3 rounded text-lg font-bold shadow-md active:translate-y-1 w-full border-2 border-[#5c1919]">
                閉じる
            </button>
        </div>
    </div>

    <!-- Sandwich Selection Modal -->
    <div id="sandwich-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#f4f1ea] p-6 max-w-sm w-full mx-4 border-4 border-double border-retro-brown shadow-[0_0_20px_rgba(255,255,255,0.2)] transform scale-90 transition-transform duration-300 flex flex-col max-h-[90vh]">
            <h2 class="text-xl font-bold text-retro-brown font-serif mb-4 text-center border-b border-retro-brown pb-2">サンドイッチを選択<br><span class="text-sm font-normal opacity-70">Select Sandwich Type</span></h2>
            
            <div id="sandwich-options" class="space-y-4 overflow-y-auto flex-grow mb-4 p-1">
                <!-- Options injected by JS -->
            </div>

            <button id="sandwich-close-btn" class="bg-retro-brown text-[#f4f1ea] px-6 py-3 rounded text-lg font-bold shadow-md active:translate-y-1 w-full">
                決定 (Confirm)
            </button>
        </div>
    </div>

    <div class="relative z-10 max-w-md mx-auto p-6 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="text-center mb-8 relative">
            <div class="absolute top-0 right-0 z-50">
                <button onclick="window.toggleLanguage()" class="text-xs border border-retro-brown px-2 py-1 rounded hover:bg-retro-brown hover:text-cream transition-colors font-serif">JP/EN</button>
            </div>
            <h1 class="text-4xl font-bold text-retro-red mb-2 font-serif tracking-widest drop-shadow-sm">
                純喫茶<br>
                <span class="text-xl text-retro-brown">ご注文票</span>
            </h1>
            <div class="inline-block border-2 border-retro-brown px-4 py-1 transform -rotate-2">
                <span class="font-mono text-sm mr-2">卓番</span>
                <span id="table-number" class="font-mono text-2xl font-bold underline decoration-retro-red decoration-2 underline-offset-4">01</span>
            </div>
            <div class="h-px bg-retro-brown w-full mt-6 opacity-30"></div>
            <div class="h-px bg-retro-brown w-full mt-1 opacity-30"></div>
        </header>

        <!-- Main Content -->
        <div class="flex-grow">
            <div id="menu-list" class="grid grid-cols-1 gap-6">
                <!-- Menu Items injected by JS -->
            </div>
        </div>

        <!-- Footer / Checkout -->
        <footer class="mt-8 sticky bottom-6 z-20">
            <div class="relative group">
                <!-- 3D Button Shadow -->
                <div class="absolute inset-0 bg-retro-dark rounded-lg transform translate-y-2 translate-x-0 rounded-b-xl"></div>
                
                <button id="order-btn" class="relative w-full bg-retro-red text-retro-cream text-xl font-bold py-4 rounded-lg transform transition-all duration-100 active:translate-y-1 active:shadow-none border-t border-l border-white/20 border-b-4 border-r-4 border-black/30 flex items-center justify-center gap-3 shadow-lg">
                    <span class="writing-vertical-rl text-xs opacity-70 absolute left-4 border-r border-white/20 pr-1 h-2/3">会計</span>
                    <span class="tracking-[0.2em] transform scale-y-110">註文スル</span>
                    <div id="total-price" class="absolute right-4 bg-retro-dark/30 px-3 py-1 rounded font-mono text-lg">¥0</div>
                </button>
            </div>
        </footer>
    </div>
    
    <!-- Audio for interaction (optional, not implemented without assets, using pure css visual feedback) -->

    <script type="module" src="app.js"></script>
</body>
</html>
